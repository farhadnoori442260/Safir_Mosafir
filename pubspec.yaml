name: safir_passengers
description: "Safir Taxi Passenger Application"
publish_to: 'none'

version: 1.0.0+4

environment:
  sdk: '>=3.4.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  easy_localization: ^3.0.7
  shamsi_date: ^1.0.2

  flutter_localizations:
    sdk: flutter

  audioplayers: ^6.0.0

  maplibre_gl: ^0.26.2
  latlong2: ^0.9.1

  geolocator: ^12.0.0
  connectivity_plus: ^6.0.4

  firebase_core: ^3.3.0
  firebase_auth: ^5.1.2
  cloud_firestore: ^5.1.0
  firebase_database: ^11.0.3
  firebase_storage: ^12.1.2
  flutter_geofire: ^2.0.7
  google_sign_in: ^6.2.1

  permission_handler: ^11.3.1
  http: ^1.2.2
  provider: ^6.1.2
  restart_app: ^1.2.1
  url_launcher: ^6.3.0
  country_picker: ^2.0.24
  rounded_loading_button_plus: ^3.0.1
  cupertino_icons: ^1.0.6
  pinput: ^5.0.1
  flutter_polyline_points: ^2.1.0
  loading_animation_widget: ^1.2.1

  share_plus: ^10.1.2
  path_provider: ^2.1.4
  image_picker: ^1.1.2

  flutter_tts: ^4.0.2
  flutter_stripe: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  flutter_native_splash: ^2.4.6

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/safir_logo_new.png

  android: true
  ios: false
  web: false

  android_12:
    color: "#FFFFFF"
    image: assets/images/safir_logo_new.png
    icon_background_color: "#FFFFFF"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/vehicles/
    - assets/lang/
    - assets/audio/fa/
    - assets/audio/fa/driver_accepted.mp3
    - assets/audio/fa/driver_arrived.mp3
    - assets/map/style.json
    - assets/fonts/

  fonts:
    - family: IranYekan
      fonts:
        - asset: assets/fonts/iranyekanwebregular.ttf
          weight: 400
        - asset: assets/fonts/iranyekanwebbold.ttf
          weight: 700

dependency_overrides:
  vector_math: 2.1.4
